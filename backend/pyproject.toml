[project]
name = "caseforge-backend"
version = "0.1.0"
description = "CaseForge AI 게임 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.28",
    "faiss-cpu>=1.9",
    "numpy>=2.0",
    "case-validator",
]

[tool.uv]
package = false

[tool.uv.sources]
case-validator = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
