[project]
name = "caseforge-backend"
version = "0.1.0"
description = "CaseForge AI game server (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "case-validator",
    "sqlalchemy>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[tool.uv.sources]
case-validator = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# prompt templates are prose; wrapping them would change the prompt
"app/agents/prompting.py" = ["E501"]
