name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 외부 액션은 커밋 SHA로 고정한다 (주석은 대응하는 태그).
jobs:
  python:
    name: Backend + case-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked --all-packages
      - name: Backend lint
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: Backend tests
        working-directory: backend
        run: uv run pytest
      - name: case-validator lint
        working-directory: packages/case-validator
        run: uv run ruff check . && uv run ruff format --check .
      - name: case-validator tests
        working-directory: packages/case-validator
        run: uv run pytest
      - name: Validate museum-001
        run: uv run case-validator check cases/museum-001

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: npm ci
      - name: API types are up to date with the backend
        run: |
          uv sync --locked --all-packages
          npm run gen:api
          git diff --exit-code -- src/types/api.ts
      - run: npm run typecheck
      - run: npm run build
