name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (Ruff, pytest, 사건 검증)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: case-validator 테스트
        working-directory: packages/case-validator
        run: uv run pytest
      - name: 백엔드 테스트
        working-directory: backend
        run: uv run pytest
      - name: 사건 스키마 · 시간선 · 퍼즐 유일해 검사
        run: |
          for case in cases/*/; do
            uv run case-validator check "$case"
          done

  frontend:
    name: Frontend (타입 검사, 빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
