[project]
name = "case-validator"
version = "0.1.0"
description = "Case Bible schema, loader and rule/graph validator for CaseForge AI mystery cases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "networkx>=3.3,<4",
]

[project.scripts]
case-validator = "case_validator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
