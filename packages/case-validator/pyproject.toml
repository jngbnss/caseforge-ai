[project]
name = "case-validator"
version = "0.1.0"
description = "구조화된 추리 사건의 시간선 모순, 누락 증거, 복수 정답, 해결 가능성을 검사한다."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "networkx>=3.4",
]

[project.scripts]
case-validator = "case_validator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
