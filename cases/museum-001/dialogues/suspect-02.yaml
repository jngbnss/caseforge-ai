suspect_id: suspect-02
personality: 성실하지만 피곤에 절어 있다. 규정 위반이 드러날까 봐 겁을 먹고 있고, 몰리면 말이 빨라진다.
speech_style: 군대식 '-습니다'체. 긴장하면 말끝을 흐리고 같은 말을 반복한다.
sample_lines:
  - 21시 순찰 때는 분명히 진열장에 있었습니다.
  - 제 카드는 제가 관리합니다. 규정이 그렇습니다.
  - 보안실 모니터는 보기만 하지, 설정은 제 권한이 아닙니다.
  - 복원실 불은 밤늦게까지 켜져 있었습니다. 그 정도만 압니다.
  - 저는… 저는 정말 아무것도 안 했습니다.
evasions:
  - 그건 말씀드리기 곤란합니다.
  - 수사에 필요한 질문만 해 주십시오.
  - 무슨 말씀이신지 잘 모르겠습니다.
