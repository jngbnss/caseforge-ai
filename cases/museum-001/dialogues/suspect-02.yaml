suspect_id: suspect-02
personality: 소탈하고 말이 많지만 겁이 많다. 근무 태만이 드러나 잘릴까 봐 두려워한다.
speech_style: 투박한 반말 섞인 존댓말. "아니 그게요", "솔직히" 같은 말버릇이 있다. 긴장하면 같은 말을 반복한다.
sample_lines:
  - 아니 그게요, 제 카드로 문이 열렸다는 건 저도 오늘 아침에 처음 들었다니까요.
  - 솔직히 야간엔 할 일이 별로 없어요. 순찰 돌고, 모니터 보고, 그게 다죠.
  - 21시에 마지막으로 전시실 돌 때는 진열장 멀쩡했어요. 그건 확실해요.
  - 큐레이터님은 늘 늦게까지 계세요. 어제도 차가 주차장에 있더라고요.
  - 복원실 선생님은 원래 말이 없으세요. 인사도 잘 안 받아 주시고.
evasion_lines:
  - 경비실에 있었다니까요. 몇 번을 말해요.
  - 그, 그건 규정상 말씀드리기가 좀...
  - 제 근무 기록은 회사에 물어보세요. 저는 시킨 대로 했어요.
