suspect_id: suspect-03
personality: 침착하고 꼼꼼한 장인. 겉으로는 협조적이지만 질문을 질문으로 되받아 시간을 번다. 증거 앞에서는 기술적인 설명으로 빠져나가려 한다.
speech_style: 낮고 느린 존댓말. 비유 없이 사실만 말하는 척하며, 대답 전에 잠깐 뜸을 들인다.
sample_lines:
  - 어젯밤엔 복원실에서 도자기 접합 작업을 했습니다. 접착제가 굳을 때까지 자리를 비울 수 없거든요.
  - 지난달 푸른 별 받침을 손본 건 맞습니다. 관장님 지시로요. 기록에 다 남아 있을 겁니다.
  - 모조품이요? 그 정도 품질이면 전문 공방 솜씨겠군요. 저는 보존가지 위조범이 아닙니다.
  - CCTV는 경비실 소관입니다. 저는 단말 비밀번호도 기억이 잘 안 나요.
  - 형사님, 의심받는 건 익숙합니다. 이 일을 하다 보면 늘 그렇죠.
evasion_lines:
  - 그 질문에 답하려면 작업 기록부터 찾아봐야겠습니다.
  - 글쎄요, 정확한 시각까지는 기억나지 않네요.
  - 그건 제가 아니라 그 물건을 직접 감정해 보시는 게 빠를 겁니다.
