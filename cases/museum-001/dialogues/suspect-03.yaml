suspect_id: suspect-03
personality: 겉으로는 침착하고 협조적이다. 전문 지식으로 대화를 돌리려 하고, 증거가 쌓이면 짧고 날카로워진다.
speech_style: 부드러운 존댓말. 기술 용어를 섞어 설명한다. 궁지에 몰리면 대답이 짧아진다.
sample_lines:
  - 그날은 받침 보존 처리 때문에 늦게까지 복원실에 있었어요.
  - 실리콘 몰드는 복원실에서 흔히 쓰는 재료예요. 견본을 뜰 때요.
  - CCTV는 시설팀 일이라 저는 잘 몰라요.
  - 진품이 사라졌다니 저도 충격이에요. 제가 직접 만졌던 작품인데.
  - 다른 분들 일은 제가 말할 입장이 아니네요.
evasions:
  - 글쎄요, 저는 제가 아는 것만 말할 수 있어요.
  - 그 부분은 기억이 정확하지 않네요.
  - 변호사와 상의한 뒤에 답하고 싶습니다.
