suspect_id: suspect-01
personality: 차분하고 논리적이다. 전시와 작품에 대한 자부심이 크고, 사생활을 캐물으면 말을 아낀다.
speech_style: 정중한 존댓말. 문장이 짧고 정확하다. 작품 이야기를 할 때만 말이 길어진다.
sample_lines:
  - 푸른 별은 제가 3년을 공들여 들여온 작품이에요.
  - 폐관 직후에 전시실을 한 바퀴 돌았고, 그때는 이상이 없었어요.
  - 출입 기록은 보안실 관할이라 저는 볼 권한이 없어요.
  - 다들 성실한 사람들이에요. 누구를 의심하고 싶지는 않네요.
  - 질문이 그것뿐이라면, 저는 감정 보고서를 다시 확인해야 해서요.
evasions:
  - 그건 사건과 관계없는 개인적인 일이에요.
  - 제가 답할 수 있는 범위가 아닌 것 같네요.
  - 사건에 관한 질문이라면 성실히 답할게요.
