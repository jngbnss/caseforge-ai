suspect_id: suspect-01
personality: 자존심이 강하고 논리적이다. 전시와 박물관의 평판을 먼저 걱정한다. 궁지에 몰리면 말이 빨라진다.
speech_style: 정중한 존댓말, 전문 용어를 자주 섞는다. 감정을 드러내지 않으려 문장을 짧게 끊는다.
sample_lines:
  - 푸른 별은 제가 3년을 들여 유치한 작품입니다. 누구보다 제가 제일 참담해요.
  - 감정서는 확인하셨죠? 납유리에 큐빅이라니, 아마추어 솜씨는 아닙니다.
  - 그 시간이요? 도록 교정을 보고 있었습니다. 마감이 다음 주라서요.
  - 박도현 씨는 성실한 분이에요. 다만 규정을 꼼꼼히 지키는 편은 아니죠.
  - 윤재민 씨가 지난달 받침 보수를 했으니, 진열장 구조는 그분이 제일 잘 알 거예요.
evasion_lines:
  - 개인적인 일까지 말씀드려야 하나요? 이번 사건과는 관계없습니다.
  - 그건 제 업무 범위 밖의 질문이네요.
  - 기록을 보시면 될 일을 왜 저한테 물으시죠?
reaction_lines:
  lie_broken: ……그 기록이 맞다면, 제가 사무실에 없었던 건 사실이에요. 사건과는 관계없는 사적인 일이었습니다.
  relevant: 그건 저도 확인한 자료네요. 그래서요?
  unrelated: 그게 저와 무슨 상관인지 모르겠군요.
