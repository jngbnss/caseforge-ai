    description: 카드키로만 출입할 수 있는 소장품 보관실. 전시실과 직통 통로가 있다.
    adjacent:
      - { to: staff-lounge, minutes: 2 }
  - location_id: restoration-room
    name: 복원실
    description: 보존 복원 작업실. CCTV 관리 단말이 함께 있다.
    adjacent:
