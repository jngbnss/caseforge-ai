case_id: museum-001
title: 사라진 푸른 다이아몬드

briefing:
  headline: 한빛시립박물관의 "푸른 별"이 모조품으로 바뀌었다
  summary: >-
    개장 전 정기 감정에서 전시 중이던 다이아몬드 "푸른 별"이 정교한 모조품으로 확인됐다.
    전날 밤 20:30 폐관 후 관내에 남아 있던 사람은 수석 큐레이터 한서윤, 야간 경비원 박도현,
    보존 복원가 윤재민 세 명뿐이다.
  objective: 현장과 기록을 조사하고 세 사람을 심문해 범인, 동기, 수법을 증거와 함께 밝혀라.
  opening_location_id: exhibition-hall
  motive_options:
    - motive_id: motive-gambling-debt
      label: 도박 빚을 갚기 위해
    - motive_id: motive-job-offer
      label: 경쟁 경매사로 이직하며 가져가려고
    - motive_id: motive-revenge
      label: 박물관에 대한 개인적 원한
    - motive_id: motive-insurance
      label: 보험금을 노린 내부 공모
  method_options:
    - method_id: method-card-theft-swap
      label: CCTV 녹화를 끊고, 남의 출입 카드를 몰래 써서 미리 만든 모조품과 바꿔치기했다
    - method_id: method-own-card
      label: 자기 출입 카드로 수장고에 들어가 진품을 들고 나왔다
    - method_id: method-appraisal-swap
      label: 개장 전 감정 도중 감정사 몰래 모조품과 바꿔치기했다
    - method_id: method-pre-transfer
      label: 전시 전에 이미 진품을 외부로 빼돌리고 모조품을 전시했다

# 장소 간 최소 이동 시간(분). 무방향이며 T03과 U01(기회) 계산에 쓰인다.
locations:
  - location_id: exhibition-hall
    name: 2층 전시실
    description: 푸른 별 진열장이 있는 메인 전시실.
    adjacent:
      - { to: storage, minutes: 1 }
      - { to: security-office, minutes: 2 }
      - { to: curator-office, minutes: 2 }
  - location_id: storage
