  - evidence_id: rec-02
    name: 채무 독촉장
    description: 복원실 금고 속 윤재민 앞 독촉장. 사설 대부업체, 상환 기한 이번 주 금요일.
    location_id: loc-restoration
    spot: 복원실 금고
    source: puzzle
    proves_fact_ids: [fact-054]
    role: key
    implicates:
